<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a4d8f7">
  <meta name="firebase-api-key" content="AIzaSyA_VPCvZah7MJJA1hmzBeAwnSDvZ1nbY5Y">
  <title>iPhone Duo</title>
  <link rel="stylesheet" href="./assets/phone-canvas.css?v=20261028-21">
</head>
<body>
  <main class="app-shell auth-active">
    <div class="shape is-closed-settled" id="duo-device" role="group" aria-label="iPhone Duo">
      <canvas class="phone-canvas" id="phone-screen" aria-hidden="true"></canvas>
      <iframe class="phone-content" id="phone-content" title="Pantalla del iPhone Duo" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer" tabindex="-1"></iframe>
      <div class="app-transition" id="app-transition" aria-hidden="true"></div>
      <span class="shape-panel shape-panel-back" aria-hidden="true"></span>
      <span class="shape-panel shape-panel-front" aria-hidden="true"></span>
      <section class="username-prompt is-visible" id="username-prompt" aria-hidden="false">
        <form class="username-card" id="username-form" role="dialog" aria-labelledby="username-label" aria-modal="true">
          <button class="back-button" id="auth-back" type="button" hidden>← Atrás</button>
          <p class="username-status" id="username-status" role="status" aria-live="polite"></p>
          <label id="username-label" for="username">Introduce tu nombre de usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nombre de usuario">
          <label id="password-label" for="password" hidden>Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" hidden>
          <label id="password-repeat-label" for="password-repeat" hidden>Repite la contraseña</label>
          <input id="password-repeat" name="password-repeat" type="password" autocomplete="new-password" hidden>
          <label id="membership-label" for="membership" hidden>Perfil</label>
          <div class="membership-select-wrap" id="membership-wrap" hidden>
            <select id="membership" name="membership" autocomplete="off">
              <option value="" selected disabled>Selecciona</option>
              <option value="3eso">3.º de ESO</option>
              <option value="4eso">4.º de ESO</option>
              <option value="spectator">Espectador</option>
            </select>
            <span class="membership-chevron" aria-hidden="true"></span>
          </div>
          <a class="create-account-link" id="create-account-link" href="#select-new-username" hidden>Si quieres crear una cuenta, haz clic aquí para elegir un nombre de usuario nuevo.</a>
          <button class="continue-button" id="username-continue" type="submit">Continuar</button>
        </form>
      </section>
      <button class="fold-toggle" id="fold-toggle" type="button" aria-label="Abrir iPhone Duo" aria-pressed="false"></button>
    </div>
    <div class="auth-notice" id="auth-notice" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="./assets/phone-canvas.js?v=20261028-21"></script>
</body>
</html>
